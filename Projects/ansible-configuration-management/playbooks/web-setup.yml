---
# Installs and configures a web server on hosts in the 'web' group.
# Demonstrates: tasks, become, handlers, variables, template module.
- name: Configure web servers
  hosts: web
  become: yes
  vars:
    http_port: 80
    server_admin: admin@example.com

  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Deploy custom index page from template
      template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
      notify: Restart Apache

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted