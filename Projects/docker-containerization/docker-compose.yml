# Multi-container app: web service + database + cache.
# Demonstrates Docker Compose, volumes, networks, and service dependencies.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - CACHE_HOST=cache
    depends_on:
      - db
      - cache
    networks:
      - appnet

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=appdb
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet

  cache:
    image: memcached:1.6-alpine
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
    driver: bridge